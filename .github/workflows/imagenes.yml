name: Imágenes de contenedor

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "deploy/docker/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    name: Construir ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: api
            dockerfile: deploy/docker/Dockerfile.api
          - imagen: inference
            dockerfile: deploy/docker/Dockerfile.inference
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Metadatos
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.imagen }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  escanear:
    name: Escaneo de vulnerabilidades de ${{ matrix.imagen }}
    needs: construir
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    strategy:
      fail-fast: false
      matrix:
        # Se escanean las dos imágenes. Antes solo se cubría `api`, y la que
        # quedaba fuera es justamente la de mayor superficie: `inference` carga
        # bibliotecas de visión artificial y tiempo de ejecución de modelos.
        imagen: [api, inference]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Normalizar la referencia de la imagen
        # Las referencias OCI solo admiten minúsculas y `github.repository`
        # conserva las mayúsculas del nombre del repositorio. Al publicar,
        # `docker/metadata-action` las convierte por su cuenta, así que la
        # referencia construida a mano aquí no coincidía con la imagen real y
        # Trivy abortaba con "could not parse reference". El valor se pasa por
        # variable de entorno, no interpolado en el script, para que el nombre
        # del repositorio no pueda inyectar comandos.
        env:
          REPOSITORIO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          NOMBRE: ${{ matrix.imagen }}
        run: echo "IMAGEN=ghcr.io/${REPOSITORIO,,}/${NOMBRE}:sha-${REVISION}" >> "$GITHUB_ENV"
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        # `category` separa los resultados por imagen. Sin él, la segunda carga
        # sustituye a la primera en Code Scanning y solo se vería una de las dos.
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.imagen }}
