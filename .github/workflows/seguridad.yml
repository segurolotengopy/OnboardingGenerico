name: Seguridad

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Los análisis programados detectan vulnerabilidades publicadas después
    # de la última integración, que es cuando aparece la mayoría.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secretos:
    name: Búsqueda de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Gitleaks sobre todo el historial
        # Se escanea el repositorio completo en vez de un rango de commits. El
        # rango incremental fallaba cuando incluía el commit raíz: no tiene padre,
        # así que `<sha>^..` es una revisión inválida, git escribía en stderr y el
        # escaneo abortaba sin revisar nada. El repositorio es pequeño, de modo que
        # el escaneo completo cuesta segundos y además cubre commits anteriores.
        # `--redact` impide que un hallazgo imprima el secreto en la bitácora.
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo \
              --redact=100 \
              --verbose \
              --no-banner \
              --exit-code 1

  sast:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      # El formateador SARIF de bandit vive en el extra `sarif`; sin él,
      # `-f sarif` es una opción inválida y no se genera ningún informe.
      - run: pip install "bandit[toml,sarif]" ruff
      - name: Bandit
        # `--exit-zero` neutraliza solo el código de salida por hallazgos, no los
        # errores de invocación: si bandit no puede escribir el informe, el paso
        # falla en vez de dejar el hueco que antes ocultaba `|| true`. Los
        # hallazgos se revisan en el panel de Code Scanning.
        run: bandit -r src/onboarding_generico -f sarif -o bandit.sarif --exit-zero
      - name: Reglas de seguridad de ruff
        run: ruff check --select S src
      - name: Publicar hallazgos de Bandit
        # Si un fallo anterior impidió generar el informe, no se intenta subirlo:
        # el error que importa ya se reportó en el paso que lo produjo.
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: bandit.sarif }

  dependencias:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: |
          pip install pip-audit
          pip install -e ".[dev,api]"
      - name: Auditar dependencias de terceros
        # `--skip-editable` excluye el propio paquete, instalado con `pip -e` y
        # ausente de PyPI por construcción.
        #
        # Sin `--strict` a propósito: esa opción falla la auditoría ante
        # CUALQUIER dependencia no recolectada, incluido el salto que
        # `--skip-editable` provoca deliberadamente, de modo que ambas juntas
        # fallan siempre ("distribution marked as editable"). No se pierde
        # cobertura: pip-audit ya sale con código 1 cuando encuentra una
        # vulnerabilidad, que es lo que este trabajo vigila.
        run: pip-audit --desc --skip-editable

  licencias:
    name: Cumplimiento de licencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - run: |
          pip install pip-licenses
          pip install -e ".[dev,api]"
      - name: Prohibir copyleft de red y licencias ausentes
        run: |
          # Política de ADR-0012. AGPL alcanzaría a todo el servicio expuesto por red;
          # 'UNKNOWN' significa que nadie verificó la licencia, que es peor.
          pip-licenses --format=json > licencias.json
          python - <<'PY'
          import json, sys
          prohibidas = ("AGPL", "SSPL", "Commons Clause", "Elastic License", "UNKNOWN")
          hallazgos = [
              p for p in json.load(open("licencias.json"))
              if any(t.lower() in p["License"].lower() for t in prohibidas)
          ]
          if hallazgos:
              for p in hallazgos:
                  print(f"::error::{p['Name']} {p['Version']} -> {p['License']}")
              sys.exit(1)
          print("Todas las licencias de dependencias son admisibles.")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: inventario-de-licencias, path: licencias.json }

  iac:
    name: Análisis de infraestructura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/terraform
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: { sarif_file: checkov.sarif }
