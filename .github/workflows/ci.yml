name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  calidad:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check src tests --output-format=github
      - name: Ruff (formato)
        run: ruff format --check src tests
      - name: Mypy estricto sobre el núcleo
        run: mypy

  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pruebas con cobertura
        run: pytest tests --cov --cov-report=xml --cov-report=term-missing
      - name: Prueba de humo sin dependencias
        run: PYTHONPATH=src python tests/run_smoke.py
      - name: Publicar cobertura
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage.xml

  arquitectura:
    name: Reglas de arquitectura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.14" }
      - name: El núcleo no debe importar SDK de nube
        run: |
          # Esta comprobación es el guardián del diseño hexagonal. Si falla, el
          # adaptador de la segunda nube deja de ser viable.
          if grep -rnE '^\s*(import|from)\s+(boto3|botocore|google\.cloud|google\.auth)' \
               src/onboarding_generico/{domain,ports,composer,application,crypto}/ ; then
            echo "::error::El núcleo importa un SDK de nube. Use un puerto."
            exit 1
          fi
          echo "Núcleo limpio."
      - name: Los puertos no deben exponer primitivas de almacenamiento
        run: |
          # Este control se hace sobre el AST y no con grep de texto: la
          # documentación de los puertos nombra `PK`, `SK` y `begins_with` justamente
          # para prohibirlos, y un grep sobre el texto crudo no distingue esa prosa
          # de una violación real. Los comentarios no existen en el AST y los
          # docstrings se descartan de forma explícita, así que solo queda la
          # superficie de código: nombres, parámetros, atributos y claves literales.
          python - <<'PY'
          import ast
          import pathlib
          import re
          import sys

          PRIMITIVAS = re.compile(
              r"(^|_)(pk|sk)($|_)"
              r"|partition_key"
              r"|sort_key"
              r"|begins_with"
              r"|condition_expression"
              r"|key_condition"
              r"|attribute_not_exists"
              r"|attribute_exists"
              r"|exclusive_start_key"
              r"|last_evaluated_key"
              r"|projection_expression"
              r"|expression_attribute"
          )


          def normalizar(nombre: str) -> str:
              """Lleva CamelCase y SCREAMING_CASE a snake_case en minúsculas."""
              return re.sub(r"(?<=[a-z0-9])(?=[A-Z])", "_", nombre).lower()


          def es_violacion(nombre: str) -> bool:
              return bool(PRIMITIVAS.search(normalizar(nombre)))


          def revisar(ruta: pathlib.Path) -> list[str]:
              arbol = ast.parse(ruta.read_text(encoding="utf-8"), filename=str(ruta))
              # Un docstring es una cadena suelta en posición de sentencia. Se marca
              # por identidad para excluirla sin excluir cadenas que sí son código.
              docstrings = {
                  id(nodo.value)
                  for nodo in ast.walk(arbol)
                  if isinstance(nodo, ast.Expr) and isinstance(nodo.value, ast.Constant)
              }
              hallazgos: list[str] = []

              def anotar(nodo: ast.AST, nombre: str, clase: str) -> None:
                  if es_violacion(nombre):
                      linea = getattr(nodo, "lineno", 0)
                      hallazgos.append(f"{ruta}:{linea}: {clase} '{nombre}'")

              for nodo in ast.walk(arbol):
                  if isinstance(nodo, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      anotar(nodo, nodo.name, "función")
                  elif isinstance(nodo, ast.ClassDef):
                      anotar(nodo, nodo.name, "clase")
                  elif isinstance(nodo, ast.arg):
                      anotar(nodo, nodo.arg, "parámetro")
                  elif isinstance(nodo, ast.keyword) and nodo.arg:
                      anotar(nodo, nodo.arg, "argumento")
                  elif isinstance(nodo, ast.Attribute):
                      anotar(nodo, nodo.attr, "atributo")
                  elif isinstance(nodo, ast.Name):
                      anotar(nodo, nodo.id, "identificador")
                  elif isinstance(nodo, ast.alias):
                      anotar(nodo, nodo.asname or nodo.name, "importación")
                  elif isinstance(nodo, ast.Constant) and isinstance(nodo.value, str):
                      # Solo cadenas con forma de clave, nunca prosa: se exige que la
                      # cadena entera sea la primitiva y que no contenga espacios.
                      if id(nodo) in docstrings:
                          continue
                      texto = nodo.value.strip()
                      if texto and " " not in texto and es_violacion(texto):
                          anotar(nodo, texto, "cadena")

              return hallazgos


          puertos = sorted(pathlib.Path("src/onboarding_generico/ports").glob("*.py"))
          if not puertos:
              print("::error::No se encontró ningún puerto que revisar.")
              sys.exit(1)

          hallazgos = [h for ruta in puertos for h in revisar(ruta)]
          if hallazgos:
              for h in hallazgos:
                  print(f"::error::Un puerto expone primitivas de DynamoDB -> {h}")
              sys.exit(1)

          print(f"Puertos limpios ({len(puertos)} archivos revisados).")
          PY

  contratos:
    name: Validación de contratos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.14" }
      - run: pip install check-jsonschema
      - name: Esquemas JSON
        run: check-jsonschema --check-metaschema api/schemas/*.json
      - name: OpenAPI
        run: |
          pip install openapi-spec-validator
          python -c "
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename
          spec, _ = read_from_filename('api/openapi.yaml')
          validate(spec)
          print('OpenAPI válido')
          "

  infraestructura:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with: { terraform_version: "1.8.5" }
      - name: Formato
        run: terraform fmt -check -recursive infra/terraform
      - name: Validar entornos
        run: |
          for env in dev stg prd; do
            echo "::group::Validando $env"
            (cd "infra/terraform/envs/$env" && terraform init -backend=false && terraform validate)
            echo "::endgroup::"
          done
