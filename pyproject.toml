[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-generico"
version = "0.1.0"
description = "Middleware B2B transaccional y serverless para la orquestacion dinamica de onboarding e identidad digital"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Onboarding Generico" }]
keywords = ["ekyc", "onboarding", "kyc", "identity", "biometrics", "mrz", "icao-9303", "serverless", "multi-tenant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

# El nucleo del dominio no tiene dependencias externas a proposito: se importa y se
# prueba con la biblioteca estandar. Cada nube y cada proveedor es un extra opcional.
dependencies = []

[project.optional-dependencies]
aws = [
  "boto3>=1.34",
  # NOTA: aqui figuraba "aws-database-encryption-sdk>=3.1", un paquete que NO
  # existe en PyPI con ese nombre; rompia `pip install -e ".[aws]"` y la build
  # de la imagen de contenedor. Se retira porque hoy nada del arbol lo importa:
  # `HierarchicalKeyProvider` habla con KMS y DynamoDB via boto3, y los metodos
  # de `DbEsdkFieldCipher` siguen en `NotImplementedError`.
  #
  # Cuando esos metodos se implementen, el paquete correcto y verificado es
  # `aws-cryptographic-material-providers` (>=1.11,<2), que es donde vive el
  # hierarchical keyring que adopta docs/adr/0006-*.md. Se agrega entonces, no
  # antes: arrastra DafnyRuntimePython y cryptography, peso muerto en el bundle
  # de Lambda mientras no se use.
]
gcp = [
  "google-cloud-firestore>=2.16",
  "google-cloud-storage>=2.16",
  "google-cloud-kms>=2.21",
  "google-cloud-workflows>=1.14",
  "google-cloud-documentai>=2.26",
  "google-cloud-secret-manager>=2.20",
  "tink>=1.10",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
]
cv = [
  # Vision artificial e inferencia local. Ver docs/15-catalogo-de-proveedores-y-licencias.md
  # antes de anadir cualquier modelo: la licencia de los pesos se evalua aparte del codigo.
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "numpy>=1.26",
  "Pillow>=10.2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Techo de version a proposito: ruff y mypy introducen reglas y
  # comprobaciones nuevas en cada minor, asi que un rango abierto hace que el
  # CI falle sin que nadie haya tocado el codigo. Los pines coinciden con los
  # `rev` de .pre-commit-config.yaml; se suben juntos y de forma deliberada.
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
  "types-boto3 ; python_version >= '3.11'",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/segurolotengopy/OnboardingGenerico"
Documentation = "https://github.com/segurolotengopy/OnboardingGenerico/blob/main/docs/00-indice.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
onboarding_generico = ["py.typed"]

# -----------------------------------------------------------------------------
# Ruff: lint y formato
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",      # pycodestyle
  "F",           # pyflakes
  "I",           # isort
  "N",           # pep8-naming
  "UP",          # pyupgrade
  "B",           # flake8-bugbear
  "C4",          # comprehensions
  "SIM",         # simplify
  "TID",         # tidy imports
  "S",           # bandit (seguridad)
  "ANN",         # anotaciones de tipo
  "RUF",
]
ignore = [
  "ANN401",  # Any explicito puntual en fronteras de adaptador
  "S101",    # assert permitido en pruebas y en invariantes de dominio
  # La familia TID se activa por su `banned-api` (el veto a boto3 fuera de
  # adapters/, regla 1 de CLAUDE.md), no por su veto a las importaciones
  # relativas. El paquete usa importaciones relativas de forma sistemática y
  # deliberada (`from ..ports.liveness import ...`) para que el nucleo sea
  # reubicable sin reescribir imports; el default `ban-relative-imports =
  # "parents"` las prohibe todas. Se ignora TID252 y se conserva TID251.
  "TID252",  # relative-imports: estilo de importacion elegido del proyecto
  # El proyecto documenta en español latinoamericano por mandato de CLAUDE.md.
  # RUF002/RUF003 marcan como «ambiguos» los guiones largos (–) y comillas
  # angulares de la prosa normal en ese idioma. Se revisaron los 5 casos: todos
  # son tipografia española legitima, ninguno es un homoglifo sospechoso.
  "RUF002",  # ambiguous-unicode-character-docstring
  "RUF003",  # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106"]
# `adapters/` es exactamente el unico lugar donde CLAUDE.md permite importar un
# SDK de nube (regla 1). El veto de TID251 sobre boto3 sigue vigente para todo
# el resto del arbol, que es lo que protege al nucleo.
"src/onboarding_generico/adapters/**" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"boto3".msg = "Los SDK de nube solo se importan dentro de src/onboarding_generico/adapters/. Use un puerto."

[tool.ruff.lint.isort]
known-first-party = ["onboarding_generico"]

# -----------------------------------------------------------------------------
# Mypy: estricto en el nucleo, tolerante en los adaptadores
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["onboarding_generico"]
strict = true
warn_unreachable = true
show_error_codes = true

# `ignore_missing_imports` se aplica al modulo IMPORTADO, no al que importa.
# Para tolerar que el CI corra mypy tras `pip install -e ".[dev]"` —es decir,
# sin los extras aws, gcp ni api— hay que nombrar aqui los modulos de terceros.
[[tool.mypy.overrides]]
module = [
  "boto3.*",
  "botocore.*",
  "google.*",
  "google.cloud.*",
  "tink.*",
  "fastapi.*",
  "starlette.*",
  "uvicorn.*",
  "pydantic.*",
  "cv2.*",
  "onnxruntime.*",
  "numpy.*",
  "PIL.*",
]
ignore_missing_imports = true

# Los adaptadores y los handlers son la frontera con SDK sin tipar: se relaja
# `disallow_untyped_calls` ahi y solo ahi. `strict = true` sigue rigiendo sobre
# domain, ports, composer, application y crypto.
[[tool.mypy.overrides]]
module = ["onboarding_generico.adapters.*", "onboarding_generico.handlers.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
# 7.4 es el minimo real: la bateria solo usa asserts, marcadores y el ajuste
# `pythonpath` (pytest 7.0+). Se fija bajo a proposito para que el pytest del
# sistema de una distribucion estable pueda ejecutar las pruebas sin crear un
# entorno virtual. El extra [dev] sigue instalando pytest>=8 para CI.
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "contract: verifica que un adaptador satisface el contrato de su puerto",
  "slow: pruebas que tardan mas de un segundo",
]

[tool.coverage.run]
source = ["src/onboarding_generico"]
branch = true
omit = ["*/adapters/aws/*", "*/adapters/gcp/*", "*/handlers/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
